<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Forms</title>
</head>
<body>

<h1>HTML Forms</h1>
<P>gather user inputs using html forms</P>

<br><br>
<hr>

<form lang="en"></form>

<hr>

<h3>application form</h3>

<form action="https://www.google.com/">
    <label for="fname">First name:</label><br>
    <input type="text" id="fname" name="fname"required><br>

    <label for="lname">Last name:</label><br>
    <input type="text" id="lname" name="lname"required> <br>

    <label for="phone">number:</label><br>
    <input type="text" id="phone" name="phone"required> <br>

    <label for="dob">Date of Birth:</label> <br>
    <input type="date" id="dob" name="dob"required> <br>

    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email"> <br>

    <label for="password">Password:</label> <br>
    <input type="password" id="password" name="password"required> <br>

    <label for="gender">Gender:</label> <br>
    <select name="gender" id="gender">
    <option>---SELECT</option>
    <option value="m">male</option>
    <option value="f">female</option>
    <option value="o">other</option>
    </select> <br>

    <label>application type</label> <br>

    <input type="radio" name="type" id="new">
    <label for="new">new</label> 
    <br>
    <input type="radio" name="type" id="old">
    <label for="old">old</label>

    <br> 

    <label>preferred roles</label> <br>
    <input type="checkbox" name="dev" id="dev">
    <label for="dev">developer</label>
    <br>
    <input type="checkbox" name="dev" id="dev">
    <label for="dev">admin staff</label>
    <br>
    <input type="checkbox" name="trainee" id="trainee">
    <label for="trainee">trainee</label>
    <br>

    <br><br>

    <button type="submit">Submit</button><br>
    
    

    <button type="reset">Reset</button>

</body>
</html>
