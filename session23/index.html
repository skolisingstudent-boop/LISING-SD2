<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory Management UI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-pZjf2Fi3q8AY+jTVz+XLUSvmOcEwGR/+UZpYq1hj–8p4i4LK0kRJ2g7R36BI9g+3" crossorigin="anonymous">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand" href="#">Inventory Dashboard</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="#addItemSection">Add Item</a></li>
          <li class="nav-item"><a class="nav-link" href="#searchSection">Search</a></li>
          <li class="nav-item"><a class="nav-link" href="#listSection">Inventory List</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container">
    <div id="alertPlaceholder"></div>

    <div class="card mb-4" id="addItemSection">
      <div class="card-header bg-secondary text-white">Add New Inventory Item</div>
      <div class="card-body">
        <form id="addItemForm" class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Name</label>
            <input type="text" id="name" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Product Name</label>
            <input type="text" id="productName" class="form-control" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">SKU</label>
            <input type="text" id="sku" class="form-control">
          </div>
          <div class="col-md-4">
            <label class="form-label">Category</label>
            <input type="text" id="category" class="form-control" required>
          </div>
          <div class="col-md-4">
            <label class="form-label">Brand</label>
            <input type="text" id="brand" class="form-control">
          </div>
          <div class="col-md-3">
            <label class="form-label">Quantity</label>
            <input type="number" id="quantity" class="form-control" min="0" value="0">
          </div>
          <div class="col-md-3">
            <label class="form-label">Price</label>
            <input type="number" id="price" class="form-control" step="0.01" min="0" value="0">
          </div>
          <div class="col-md-3">
            <label class="form-label">Supplier</label>
            <input type="text" id="supplier" class="form-control">
          </div>
          <div class="col-md-3">
            <label class="form-label">Reorder Level</label>
            <input type="number" id="reorderLevel" class="form-control" min="0" value="0">
          </div>
          <div class="col-md-3">
            <label class="form-label">Stocks</label>
            <input type="number" id="stocks" class="form-control" min="0" value="0">
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-primary">Submit Item</button>
            <button type="button" id="refreshBtn" class="btn btn-outline-secondary ms-2">Refresh List</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card mb-4" id="searchSection">
      <div class="card-header bg-secondary text-white">Search Inventory by Name</div>
      <div class="card-body row g-3 align-items-end">
        <div class="col-md-9">
          <label class="form-label">Item Name</label>
          <input type="text" id="searchName" class="form-control" placeholder="Enter exact item name">
        </div>
        <div class="col-md-3 d-grid">
          <button type="button" id="searchBtn" class="btn btn-success">Search Item</button>
        </div>
      </div>
    </div>

    <div class="card mb-4" id="listSection">
      <div class="card-header bg-secondary text-white">Inventory Items</div>
      <div class="card-body table-responsive">
        <table class="table table-hover table-bordered align-middle">
          <thead class="table-light">
            <tr>
              <th>Name</th>
              <th>Product</th>
              <th>Category</th>
              <th>Brand</th>
              <th>Qty</th>
              <th>Price</th>
              <th>Supplier</th>
              <th>Stocks</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="inventoryTableBody">
            <tr><td colspan="9" class="text-center">Loading inventory...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-4AEOiQ3ZKkiLGi5R66+E2c7XigE66QaAGVtnz1YBdbzGG6GGJxW2XWWw1pZVPp8y" crossorigin="anonymous"></script>
<script>
    const alertPlaceholder = document.getElementById('alertPlaceholder');
    const apiBase = '';

    function showAlert(message, type = 'success') {
    const wrapper = document.createElement('div');
    wrapper.innerHTML = `<div class="alert alert-${type} alert-dismissible fade show" role="alert">
        ${message}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>`;
    alertPlaceholder.innerHTML = '';
    alertPlaceholder.append(wrapper);
    }

    async function fetchAllItems() {
    try {
        const response = await fetch(`${apiBase}/inventory/get-all-item`);
        const result = await response.json();
        const items = result.data || [];
        const tbody = document.getElementById('inventoryTableBody');

        if (!Array.isArray(items) || items.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" class="text-center">No inventory items found.</td></tr>';
        return;
        }

        tbody.innerHTML = items.map(item => `
        <tr>
            <td>${item.name || ''}</td>
            <td>${item.productName || ''}</td>
            <td>${item.category || ''}</td>
            <td>${item.brand || ''}</td>
            <td>${item.quantity ?? 0}</td>
            <td>${item.price ?? 0}</td>
            <td>${item.supplier || ''}</td>
            <td>${item.stocks ?? 0}</td>
            <td>
            <button class="btn btn-sm btn-danger" onclick="deleteItem('${item._id}')">Delete</button>
            </td>
        </tr>
        `).join('');
    } catch (error) {
        showAlert('Unable to load inventory. Check the server.', 'danger');
    }
    }

    async function addItem(event) {
    event.preventDefault();
    const payload = {
        name: document.getElementById('name').value.trim(),
        productName: document.getElementById('productName').value.trim(),
        sku: document.getElementById('sku').value.trim(),
        category: document.getElementById('category').value.trim(),
        quantity: Number(document.getElementById('quantity').value) || 0,
        price: Number(document.getElementById('price').value) || 0,
        supplier: document.getElementById('supplier').value.trim(),
        reorderLevel: Number(document.getElementById('reorderLevel').value) || 0,
        brand: document.getElementById('brand').value.trim(),
        stocks: Number(document.getElementById('stocks').value) || 0
    };

    try {
        const response = await fetch(`${apiBase}/inventory/add`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
        });
        const result = await response.json();

        if (response.status === 201) {
        showAlert(result.message || 'Inventory item added successfully.');
        document.getElementById('addItemForm').reset();
        fetchAllItems();
        } else {
        showAlert(result.message || 'Failed to add inventory item.', 'warning');
        }
    } catch (error) {
        showAlert('Error sending request to server.', 'danger');
    }
    }

    async function searchItem() {
    const name = document.getElementById('searchName').value.trim();
    if (!name) {
        showAlert('Please enter an item name to search.', 'warning');
        return;
    }

    try {
        const response = await fetch(`${apiBase}/inventory/get-item?itemName=${encodeURIComponent(name)}`);
        const result = await response.json();

        if (response.ok && result.data) {
        const item = result.data;
        showAlert(`Item found: ${item.name} (${item.productName}) in ${item.category}.`, 'success');
        document.getElementById('inventoryTableBody').innerHTML = `
            <tr>
            <td>${item.name || ''}</td>
            <td>${item.productName || ''}</td>
            <td>${item.category || ''}</td>
            <td>${item.brand || ''}</td>
            <td>${item.quantity ?? 0}</td>
            <td>${item.price ?? 0}</td>
            <td>${item.supplier || ''}</td>
            <td>${item.stocks ?? 0}</td>
            <td><button class="btn btn-sm btn-danger" onclick="deleteItem('${item._id}')">Delete</button></td>
            </tr>
        `;
        } else {
        showAlert(result.message || 'Item not found.', 'warning');
        }
    } catch (error) {
        showAlert('Search request failed.', 'danger');
    }
    }

    async function deleteItem(itemId) {
    if (!confirm('Delete this inventory item?')) return;

    try {
        const response = await fetch(`${apiBase}/inventory/delete/${itemId}`, {
        method: 'DELETE'
        });
        const result = await response.json();
        if (response.ok) {
        showAlert(result.message || 'Inventory item deleted.');
        fetchAllItems();
        } else {
        showAlert(result.message || 'Unable to delete item.', 'warning');
        }
    } catch (error) {
        showAlert('Delete request failed.', 'danger');
    }
    }

    document.getElementById('addItemForm').addEventListener('submit', addItem);
    document.getElementById('refreshBtn').addEventListener('click', fetchAllItems);
    document.getElementById('searchBtn').addEventListener('click', searchItem);

    fetchAllItems();
</script>
</body>
</html>
